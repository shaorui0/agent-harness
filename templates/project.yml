# .harness/project.yml — 这个项目的运行契约
#
# 每个 session 开头由 SessionStart hook 读取并注入。所有字段可选，
# 缺省值见 agent-harness/hooks/_harness.py 的 DEFAULTS。

name: __NAME__
description: >
  一句话说明这个项目在做什么。会出现在每个 session 的开头。

# ── 单一事实来源 ────────────────────────────────────────────────
# STATE.md 是 compaction 的产物，只写当前有效的结论。
# 历史和被推翻的内容在 .harness/archive/ 里，不进这里。
state:
  file: .harness/STATE.md
  max_chars: 8000

# 权威口径的入口文件。只注入路径，不注入正文，让模型按需读。
context_files: []
  # - docs/pool-system/00-INDEX.md

# ── WAL ────────────────────────────────────────────────────────
journal:
  dir: .harness/journal
  max_message_chars: 4000
  tail: 5                      # session 开头注入最近几条

# 归档目录**必须被 git 跟踪**。compaction 会把被取代的文档 `git mv` 进来，
# 落在 gitignore 覆盖范围内的话，那个动作等于从仓库里静默删文件。
# `.harness/` 整体被忽略时，把这里指到一个被跟踪的路径，例如 docs/_archive。
archive:
  dir: .harness/archive

# ── 自主边界 ───────────────────────────────────────────────────
# 目的是「安全区内不再确认，安全区外直接拦住」。
autonomy:
  auto_allow_inside: true

  # 命中即放行，不弹权限提示。按命令前缀匹配（会自动跳过 `# INTENT:` 注释行）。
  allow_prefixes: []
    # - "kubectl get"
    # - "kubectl describe"
    # - "git status"

  # 正则，命中即硬拦截并说明原因。
  deny_patterns: []
    # - "kubectl delete (ns|namespace)"
    # - "rm -rf /"

  # 写操作限定在这些相对路径之内，留空表示不限制。
  write_roots: []
    # - docs
    # - .harness

  k8s:
    allow_contexts: []
      # - kwestpreprod
    deny_contexts: []
      # - kwestproda

# ── scope gate ─────────────────────────────────────────────────
# 纯 opt-in：protected_paths 留空 = 完全不限制，不会回退到 write_roots
# 或整个仓库（2026-08-14 撤销了那条默认从严逻辑，见
# docs/scope-and-spec-gate-design.md 的撤销记录）。本地、git 跟踪的编辑
# 本身就可回退，git 是安全网，不需要每次写文件前先声明范围。
# 只有真正想给特定路径加额外摩擦时才显式列出来（比如这套 harness 自己的
# 自举文件），不要当成默认要开的开关。
scope_gate:
  enabled: true
  protected_paths: []
    # - docs/pool-system

# ── 调查并行度 ─────────────────────────────────────────────────
explore:
  default_agents: 3
  max_agents: 5

# ── 输出契约 ───────────────────────────────────────────────────
output:
  contract: structured     # structured | free
  nudge_once: true         # 散文长回复时提醒一次
  auto_continue: true      # 在 envelope 内停下来征求同意时推回去一次

# ── 派发编排（/harness-dispatch）─────────────────────────────
# 任何 hook 都不读这一段，纯粹是 skill 的默认值覆盖点。
# 这里的上限和 explore 的上限约束的不是同一件事：explore 限的是意见扇出
# （多个 agent 对同一问题各给一份看法，合并成本落回人脑），
# dispatch 限的是产物扇出（各自产出互不重叠的文件与事实，合并是拼接）。
dispatch:
  wave_width: 5              # 每波默认派几个
  max_agents_per_wave: 8     # 每波硬上限
  max_agents_total: 24       # 一次运行累计硬上限
  max_waves: 4               # 波数硬上限
  executor: general-purpose  # 需要写权限的子 agent 类型
  model: sonnet              # 执行档模型
