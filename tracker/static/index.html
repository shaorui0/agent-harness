<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>harness tracker</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#677084;--line:#e3e6ec;--accent:#2f6fec;--accent-soft:#e8f0fe;
  --ok:#1f9d55;--ok-soft:#e5f6ec;--warn:#c27c0e;--warn-soft:#fdf3e1;--bad:#d64545;--bad-soft:#fde8e8;--idle:#8a93a5;
  --code:#f1f3f6;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b;--panel:#1a1e26;--ink:#e6e9ef;--muted:#98a1b3;--line:#2a303b;--accent:#6b9bff;--accent-soft:#1e2a44;
  --ok:#4cc38a;--ok-soft:#173326;--warn:#e0a43c;--warn-soft:#3a2d14;--bad:#ef6b6b;--bad-soft:#3d1c1c;--idle:#6f788a;--code:#232833;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b;--panel:#1a1e26;--ink:#e6e9ef;--muted:#98a1b3;--line:#2a303b;--accent:#6b9bff;--accent-soft:#1e2a44;
  --ok:#4cc38a;--ok-soft:#173326;--warn:#e0a43c;--warn-soft:#3a2d14;--bad:#ef6b6b;--bad-soft:#3d1c1c;--idle:#6f788a;--code:#232833;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:12.5px}

/* top bar */
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sp{flex:1}
.tag{display:inline-block;font-size:11.5px;line-height:18px;padding:0 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.t-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.t-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.t-acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.d-running{background:var(--accent)}.d-needs_input{background:var(--warn)}.d-done{background:var(--ok)}.d-exited{background:var(--idle)}.d-stale{background:var(--bad)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{margin:0}
.btn{font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);background:transparent}
.btn:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.55;cursor:default}
.btn.p{background:var(--accent);color:#fff}
.btn.p:hover{opacity:.9}
.refresh{font-size:12px;color:var(--muted);white-space:nowrap}
#errbar{background:var(--bad-soft);color:var(--bad);padding:6px 16px;font-size:13px;border-bottom:1px solid var(--line)}

/* layout */
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
aside{position:sticky;top:var(--hh,48px);max-height:calc(100vh - var(--hh,48px));overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 0}
.navtoggle{display:none}
.ws{display:flex;align-items:center;gap:6px;padding:7px 14px 3px;font-weight:600;cursor:pointer;user-select:none;width:100%;background:none;border:0;text-align:left}
.ws .car{color:var(--muted);font-size:10px;width:10px}
.ws .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws small{color:var(--muted);font-weight:400;margin-left:auto;white-space:nowrap;font-size:11.5px}
.sess{display:flex;align-items:center;gap:8px;width:100%;padding:5px 14px 5px 30px;background:none;border:0;border-left:3px solid transparent;text-align:left}
.sess:hover{background:var(--code)}
.sess.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.sess .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .pg{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.sess .pg.bad{color:var(--bad)}
.emptynav{padding:12px 16px;color:var(--muted);font-size:13px}

main{padding:16px 20px 80px;min-width:0;max-width:980px}
h2.title{font-size:19px;margin:0 0 2px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;color:var(--muted);font-size:12.5px;margin:4px 0 14px}
.meta .ph{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.blk-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:8px}
.blk-h b{font-size:14px;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--code);border-radius:3px;overflow:hidden;width:120px;flex:none}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.w{width:100%;flex:1;min-width:60px}
.grp{font-size:12px;color:var(--muted);font-weight:600;margin:8px 0 2px}
ul.chk{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12.5px}
ul.chk li{padding:1px 0;overflow-wrap:anywhere;white-space:pre-wrap}
ul.chk li.x{color:var(--muted)}
ul.chk li.now{color:var(--accent);font-weight:600}
details{margin-top:8px}
details>summary{cursor:pointer;color:var(--accent);font-size:12.5px}
details .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:var(--muted);margin-top:4px}
.callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:6px 12px;border-radius:0 8px 8px 0;font-size:13px;margin:8px 0}
.action{overflow-wrap:anywhere}
.fallback{display:flex;gap:8px;align-items:center;margin:-6px 0 12px;flex-wrap:wrap}
.fallback input{flex:1;min-width:200px;font:12px var(--mono);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--code);color:var(--ink)}
.err{color:var(--bad);font-size:12.5px;margin-top:6px}

/* overview */
.ov-ws{margin-bottom:14px}
.ov-row{display:flex;align-items:center;gap:10px;padding:3px 0;flex-wrap:wrap}
.ov-row .t{min-width:0;flex:1 1 160px;overflow-wrap:anywhere}
.link{background:none;border:0;padding:0;color:var(--accent);text-align:left}
.link:hover{text-decoration:underline}

@media (max-width:700px){
  .layout{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:0}
  .navtoggle{display:flex;width:100%;justify-content:space-between;padding:8px 16px;background:none;border:0;font-weight:600}
  aside .tree{display:none;max-height:50vh;overflow-y:auto;padding-bottom:8px}
  aside.open .tree{display:block}
  main{padding:14px 16px 60px}
  .ws{padding-left:16px}.sess{padding-left:28px}
}
@media (min-width:701px){.navtoggle{display:none!important}}
.muted{color:var(--muted)}
a.btn{text-decoration:none;display:inline-block}
.st-row{margin:6px 0}
.st-lbl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.st-text{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.st-text.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
.st-tool{font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;color:var(--muted);background:var(--code);border-radius:6px;padding:4px 8px}
.st-now{margin:6px 0;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.st-now .v{overflow-wrap:anywhere;min-width:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:12.5px}
.linkbtn:hover{text-decoration:underline}
.rc{overflow-wrap:anywhere}
.rc h4{font-size:13.5px;margin:12px 0 4px}
.rc h4:first-child{margin-top:2px}
.rc p{margin:2px 0;white-space:pre-wrap}
.rc ul,.rc ol{margin:2px 0;padding-left:22px}
.rc ul{list-style:disc}
.rc ol{list-style:decimal}
code.ic{background:var(--code);border-radius:4px;padding:0 4px;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
.rc li{margin:1px 0;overflow-wrap:anywhere}
.codewrap{position:relative;margin:6px 0}
.codewrap pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px 64px 8px 10px;font-family:var(--mono);font-size:12.5px;overflow-x:auto;white-space:pre}
.codewrap .btn{position:absolute;top:6px;right:6px;background:var(--panel)}
a.btn.cli{display:inline-flex;align-items:center;gap:6px}
.tk{display:flex;gap:6px;align-items:baseline;width:100%;margin:0;padding:1px 0;background:none;border:0;text-align:left;font:inherit;font-weight:700;color:var(--ink)}
button.tk{cursor:pointer}
button.tk:hover .tt{text-decoration:underline}
.tk .car{color:var(--muted);font-size:10px;width:10px;flex:none;font-weight:400}
.tk .tt{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.tk .cnt{color:var(--muted);font-weight:400;white-space:nowrap;flex:none}
.tk.x{color:var(--muted)}
.tk.now{color:var(--accent)}
ul.chk li.tkli{margin-top:3px}
ul.chk li.tkli:first-child{margin-top:0}
details.proc{margin-top:0;margin-bottom:12px}
details.proc>summary{color:var(--muted)}
.exr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:13px;margin:2px 0}
.exr .nm{font-weight:600;overflow-wrap:anywhere;min-width:0}
.exr .note{white-space:nowrap}
.mk{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;font-size:11.5px;line-height:17px;padding:0 6px;border-radius:999px;margin-left:6px;white-space:nowrap;font-weight:400;display:inline-block}
.mk.ok{color:var(--muted);padding:0 2px}
.mk.un{background:var(--warn-soft);color:var(--warn)}
.mk.ud{background:var(--accent-soft);color:var(--accent)}
.mk.cn{margin-left:4px}
ul.chk li.ev{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;font-size:12px;color:var(--muted);opacity:.9;white-space:normal;padding-top:0}
.offs{margin-top:8px}
.offs ul{margin:2px 0 0;padding-left:20px;list-style:disc;font-size:13px}
.offs li{overflow-wrap:anywhere}
.nospec{border-left:3px solid var(--warn)}
.blk-f{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:8px}
</style>
</head>
<body>
<header id="hdr">
  <span class="brand">harness tracker</span>
  <span class="chips" id="chips"></span>
  <label class="toggle"><input type="checkbox" id="onlyMe"> 只看需要我的</label>
  <span class="sp"></span>
  <span id="cli"></span>
  <span class="refresh" id="refreshed">加载中…</span>
  <button class="btn" id="refreshBtn" type="button">刷新</button>
</header>
<div id="errbar" hidden></div>
<div class="layout">
  <aside id="aside">
    <button class="navtoggle" id="navtoggle" type="button"><span id="navlabel">session 列表</span><span id="navcar">▾</span></button>
    <div class="tree" id="tree"></div>
  </aside>
  <main id="detail"></main>
</div>

<script>
(function () {
  'use strict';
  var MOCK = /[?&]mock=1/.test(location.search);
  var PHASE_TXT = { running: '在跑', needs_input: '在等你输入', done: '本轮结束', stale: '疑似卡死', exited: '已退出' };
  var PHASE_LBL = { running: 'running', needs_input: 'needs_input', done: 'done', stale: 'stale', exited: 'exited' };

  var data = null, lastText = null, lastOk = null;
  var selected = null;
  var collapsed = {};
  var onlyMe = false;
  var openSpec = {}, openProp = {};
  var chkLocal = {};      // sid -> check (fresh, from our own polling)
  var chkState = {};      // sid -> {error}
  var chkPollers = {};    // sid -> {timer, t0}
  var mockChecks = {};
  var recapLocal = {};    // sid -> recap
  var recapState = {};    // sid -> {error}
  var recapPollers = {};  // sid -> {timer, t0}
  var mockRecapJobs = {};
  var openText = {};      // sid -> last_text expanded
  var openGrp = {};       // task-row key -> expanded (explicit user choice)
  var openProc = {};      // sid -> process details open

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- tiny DOM helper (text only, never innerHTML) ---------- */
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
      if (c == null || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }
  function tag(text, cls) { return h('span', { class: 'tag ' + (cls || ''), text: text }); }
  function dot(phase) { return h('span', { class: 'dot d-' + phase }); }

  function human(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    if (sec < 60) return sec + ' 秒';
    if (sec < 3600) return Math.floor(sec / 60) + ' 分钟';
    if (sec < 86400) { var hh = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60); return hh + ' 小时' + (mm ? ' ' + mm + ' 分' : ''); }
    var d = Math.floor(sec / 86400), h2 = Math.floor(sec % 86400 / 3600); return d + ' 天' + (h2 ? ' ' + h2 + ' 小时' : '');
  }
  function hhmm(d) { function p(n) { return (n < 10 ? '0' : '') + n; } return p(d.getHours()) + ':' + p(d.getMinutes()); }
  function fmtTime(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return String(iso);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function cleanMd(t) { return String(t || '').replace(/^#+\s*/gm, '').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim(); }
  function ctxFmt(n) { return n == null ? '' : (n >= 1000 ? Math.round(n / 1000) + 'k' : String(n)); }

  /* ---------- data helpers ---------- */
  function allSessions() {
    var out = [];
    (data && data.workspaces || []).forEach(function (w) { (w.sessions || []).forEach(function (s) { out.push({ ws: w, s: s }); }); });
    return out;
  }
  function find(sid) {
    var a = allSessions();
    for (var i = 0; i < a.length; i++) if (a[i].s.session_id === sid) return a[i];
    return null;
  }
  function changesOf(ws, s) {
    var ids = s.change_ids || [];
    return (ws.changes || []).filter(function (c) { return ids.indexOf(c.id) >= 0; });
  }
  function progOf(chs) {
    var d = 0, t = 0;
    chs.forEach(function (c) { d += (c.progress && c.progress.done) || 0; t += (c.progress && c.progress.total) || 0; });
    return { d: d, t: t };
  }
  function checkOf(s) {
    var loc = chkLocal[s.session_id];
    if (loc && (!s.check || (loc.generated_at || '') >= (s.check.generated_at || ''))) return loc;
    return s.check;
  }
  function isCheckPending(s) { return !!chkPollers[s.session_id]; }
  function recapOf(s) {
    var loc = recapLocal[s.session_id];
    if (loc && (!s.recap || (loc.generated_at || '') >= (s.recap.generated_at || ''))) return loc;
    return s.recap;
  }
  function isRecapPending(s) { return !!recapPollers[s.session_id]; }

  /* ---------- header ---------- */
  function renderHeader() {
    var c = document.getElementById('chips');
    c.replaceChildren();
    if (!data) return;
    var sm = data.summary || {};
    if (sm.needs_input > 0) c.appendChild(tag(sm.needs_input + ' 个 session 在等你', 't-warn'));
    c.appendChild(tag('running ' + (sm.running || 0), 't-acc'));
    c.appendChild(tag('done ' + (sm.done || 0), 't-ok'));
    c.appendChild(tag('stale ' + (sm.stale || 0), (sm.stale > 0 ? 't-bad' : '')));
    c.appendChild(tag('exited ' + (sm.exited || 0)));
    renderCli();
    fixHeaderOffset();
  }
  /* ---------- CloudCLI 入口 ---------- */
  function cliInfo() { return (data && data.links && data.links.cloudcli) || null; }
  function renderCli() {
    var box = document.getElementById('cli');
    box.replaceChildren();
    var ci = cliInfo();
    if (!ci || !ci.url) return;
    var a = h('a', { class: 'btn cli', href: ci.url, target: '_blank', rel: 'noopener',
      title: ci.up ? '在 CloudCLI 里聊天、开 shell、看 git；Tracker tab 里是同一份数据' : 'CloudCLI 没有响应：' + ci.url });
    a.appendChild(h('i', { class: 'dot ' + (ci.up ? 'd-done' : 'd-exit') }));
    a.appendChild(document.createTextNode('CloudCLI ↗'));
    box.appendChild(a);
    if (ci.up && ci.plugin_installed === false) box.appendChild(h('span', { class: 'note', text: ' 未装 Tracker 插件：bin/harness install' }));
  }
  function renderRefreshed() {
    var el = document.getElementById('refreshed');
    el.textContent = lastOk ? ('刷新于 ' + hhmm(lastOk) + ' · 30s 自动刷新' + (MOCK ? ' · mock' : '')) : '加载中…';
  }
  function fixHeaderOffset() {
    var hd = document.getElementById('hdr');
    var eb = document.getElementById('errbar');
    var hgt = hd.offsetHeight;
    document.documentElement.style.setProperty('--hh', hgt + 'px');
  }

  /* ---------- sidebar ---------- */
  function sessMatches(s) { return !onlyMe || s.phase === 'needs_input' || s.phase === 'stale'; }

  function renderTree() {
    var t = document.getElementById('tree');
    var keepTop = t.scrollTop;
    t.replaceChildren();
    if (!data) return;
    var shown = 0;
    (data.workspaces || []).forEach(function (w) {
      var sess = (w.sessions || []).filter(sessMatches);
      if (onlyMe && !sess.length) return;
      shown++;
      var isCol = !!collapsed[w.name];
      t.appendChild(h('button', { class: 'ws', type: 'button', 'aria-expanded': String(!isCol), onclick: function () {
        collapsed[w.name] = !collapsed[w.name]; lsSet('tracker.collapsed', JSON.stringify(collapsed)); renderTree();
      } }, [
        h('span', { class: 'car', text: isCol ? '▸' : '▾' }),
        h('span', { class: 'nm', text: w.name }),
        h('small', { text: (w.sessions || []).length + ' sessions · ' + (w.changes || []).length + ' tasks' })
      ]));
      if (isCol) return;
      sess.forEach(function (s) {
        var chs = changesOf(w, s), right;
        if (chs.length) { var p = progOf(chs); right = h('span', { class: 'pg', text: p.d + '/' + p.t }); }
        else right = h('span', { class: 'pg', text: '无 spec' });
        t.appendChild(h('button', { class: 'sess' + (s.session_id === selected ? ' sel' : ''), type: 'button', title: PHASE_LBL[s.phase] || s.phase,
          onclick: function () { select(s.session_id); } }, [dot(s.phase), h('span', { class: 'n', text: s.name || s.session_id.slice(0, 8) }), right]));
      });
    });
    if (!shown) t.appendChild(h('div', { class: 'emptynav', text: onlyMe ? '没有需要你处理的 session' : '暂无 session' }));
    t.scrollTop = keepTop;
    var f = find(selected);
    document.getElementById('navlabel').textContent = f ? ('当前：' + (f.s.name || '')) : 'session 列表';
  }

  /* ---------- detail ---------- */
  /* ---------- task tree (group = task row, items = subtasks) ---------- */
  function groupTasks(items) {
    var tasks = [], byGroup = {}, cur = null, firstNow = -1;
    items.forEach(function (it, i) { if (firstNow < 0 && it.current && !it.done) firstNow = i; });
    items.forEach(function (it, i) {
      var lvl = it.level || 0;
      var row = { id: it.id, text: (it.id ? it.id + ' ' : '') + it.text, done: !!it.done, now: i === firstNow };
      if (it.group) {
        var t = byGroup[it.group];
        if (!t) { t = { title: it.group, own: true, subs: [] }; byGroup[it.group] = t; tasks.push(t); }
        row.indent = lvl + 1; t.subs.push(row); cur = null;
      } else if (lvl === 0 || !cur) {
        cur = { id: it.id, title: row.text, own: row.done, now: row.now, subs: [] }; tasks.push(cur);
      } else { row.indent = lvl; cur.subs.push(row); }
    });
    tasks.forEach(function (t) {
      var n = 0; t.subs.forEach(function (r) { if (r.done) n++; });
      t.n = n; t.total = t.subs.length; t.done = t.own && n === t.total;
    });
    return tasks;
  }
  var VERDICT = {
    ok: { cls: 'ok', text: '✓' },

  function inline(text) {
    return String(text).split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/).map(function (seg) {

  function renderMd(md) {

    var para = [], ul = null, i = 0;
    function flushP() { if (para.length) { box.appendChild(h('p', {}, inline(para.join('\n')))); para = []; } }
    while (i < lines.length) {
      var ln = lines[i];
      if (/^\s*```/.test(ln)) {
        flushP(); ul = null;
        var code = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        box.appendChild(codeBlock(code.join('\n')));
        continue;
      }
      var m;
      if ((m = /^#{2,}\s+(.*)$/.exec(ln)) || (m = /^#\s+(.*)$/.exec(ln))) { flushP(); ul = null; box.appendChild(h('h4', {}, inline(m[1]))); }

        ul.appendChild(h('li', {}, inline(m[1])));

      else { ul = null; para.push(ln); }
      i++;

    flushP();
    return box;
  }

          ? h('button', { class: 'link t', type: 'button', text: c.title, onclick: function () { select(first); } })
          : h('span', { class: 't', text: c.title });
        box.appendChild(h('div', { class: 'ov-row' }, [title, h('span', { class: 'bar' }, h('i', { style: 'width:' + pct + '%' })), h('span', { class: 'mono', text: p.done + '/' + p.total })]));
      });
      cb.appendChild(box);
    });
    if (!any) cb.appendChild(h('div', { class: 'note', text: '没有 openspec change' }));
    frag.appendChild(cb);
    return frag;
  }

  function renderDetail() {
    var m = document.getElementById('detail');
    var sy = window.scrollY;
    var af = document.activeElement;
    m.replaceChildren();
    if (!data) { return; }
    var f = selected && find(selected);
    m.appendChild(f ? renderSession(f.ws, f.s) : renderOverview());
    window.scrollTo(0, sy);
  }

  function renderAll() { renderHeader(); renderTree(); renderDetail(); renderRefreshed(); }

  /* ---------- selection ---------- */
  function select(sid, noHash) {
    selected = sid || null;
    lsSet('tracker.selected', selected || '');
    if (!noHash) {
      var nh = selected ? '#sid=' + encodeURIComponent(selected) : '';
      if (location.hash !== nh) { try { history.replaceState(null, '', location.pathname + location.search + nh); } catch (e) { location.hash = nh; } }
    }
    renderTree(); renderDetail();
    window.scrollTo(0, 0);
    if (selected && window.matchMedia('(max-width:700px)').matches) document.getElementById('aside').classList.remove('open');
    var f = selected && find(selected);
    if (f && f.s.check_pending && !chkPollers[selected]) startCheckPolling(selected);
    if (f && f.s.recap_pending && !recapPollers[selected]) startRecapPolling(selected);
  }
  function hashSid() {
    var m = /[#&]sid=([^&]+)/.exec(location.hash);
    return m ? decodeURIComponent(m[1]) : null;
  }

  /* ---------- api / check generation ---------- */
  function api(method, url, body) {
    if (MOCK && /\/api\/check/.test(url)) return mockCheck(method, url, body);
    if (MOCK && /\/api\/recap/.test(url)) return mockRecap(method, url, body);
    var opt = { method: method, headers: {} };
    if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch(url, opt).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok && r.status !== 202) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
  }
  function mockCheck(method, url, body) {
    return new Promise(function (res) {
      if (method === 'POST') {
        if (!mockChecks[body.session_id]) mockChecks[body.session_id] = { t: Date.now() };
        return res({ pending: true });
      }
      var q = decodeURIComponent((url.split('session_id=')[1] || '').split('&')[0]);
      var job = mockChecks[q];
      if (job && Date.now() - job.t >= 2000) {
        delete mockChecks[q];
        var f = find(q), now = new Date().toISOString(), badDone = false, udDone = false;
        var chg = (f ? changesOf(f.ws, f.s) : []).map(function (c) {
          var its = (c.items || []).filter(function (x) { return x.id; });
          var lastDone = -1; its.forEach(function (x, i) { if (x.done) lastDone = i; });
          var out = [];
          its.forEach(function (x, i) {
            if (x.done) {
              if (i === lastDone && !badDone) { badDone = true; out.push({ id: x.id, verdict: 'unsupported', evidence: '' }); }
              else out.push({ id: x.id, verdict: 'ok', evidence: '示例：记录里有对应的命令和结果' });
            } else if (!udDone) { udDone = true; out.push({ id: x.id, verdict: 'unticked_done', evidence: '示例：相关命令已执行并成功' }); }
          });
          return { id: c.id, items: out };
        });
        return res({ pending: false, error: null, check: { changes: chg, off_spec: ['示例：顺手调整了一处日志格式', '示例：清理了一个无用的临时文件'],
          blocked_on: null, generated_at: now, source_mtime: now, stale: false, model: 'sonnet' } });
      }
      res({ pending: !!job, error: null, check: null });
    });
  }
  function startCheck(sid) {
    chkState[sid] = {};
    chkPollers[sid] = { timer: null, t0: Date.now(), starting: true };
    api('POST', '/api/check', { session_id: sid }).then(function () { startCheckPolling(sid); }, function (e) {
      clearTimeout(chkPollers[sid] && chkPollers[sid].timer);
      delete chkPollers[sid]; chkState[sid] = { error: '核对失败：' + e.message }; renderDetail();
    });
    renderDetail();
  }
  function startCheckPolling(sid) {
    var p = chkPollers[sid] || (chkPollers[sid] = { t0: Date.now() });
    if (p.timer) return;
    p.t0 = Date.now();
    function stop(err) {
      clearTimeout(p.timer); delete chkPollers[sid];
      chkState[sid] = err ? { error: err } : {};
      renderTree(); renderDetail();
    }
    function tick() {
      if (Date.now() - p.t0 > 150000) return stop('核对超时（150 秒），请稍后重试');
      api('GET', '/api/check?session_id=' + encodeURIComponent(sid)).then(function (j) {
        if (j.pending) { p.timer = setTimeout(tick, 2000); return; }
        if (j.error) return stop('核对失败：' + j.error);
        if (j.check) chkLocal[sid] = j.check;
        stop(null);
      }, function (e) { stop('核对失败：' + e.message); });
    }
    p.timer = setTimeout(tick, 2000);
    renderDetail();
  }

  /* ---------- board loading ---------- */
  function setErr(msg) {
    var e = document.getElementById('errbar');
    if (msg) { e.textContent = msg; e.hidden = false; } else e.hidden = true;
    fixHeaderOffset();
  }
  /* 页面在浏览器里开着的时候，看板可能已经升级（接口改了）。首次拿到的版本和后来的不一样 = 页面过期，提示刷新。 */
  var uiVer = null, uiStale = false;
  function checkUiVersion(v) {
    if (!v) return;
    if (uiVer === null) { uiVer = v; return; }
    if (v !== uiVer) {
      uiStale = true;
      var e = document.getElementById('errbar');
      e.replaceChildren();
      e.appendChild(document.createTextNode('看板已更新，这个页面是旧版本，按钮可能失效。 '));
      var a = document.createElement('a');
      a.href = '#'; a.textContent = '点此刷新'; a.style.fontWeight = '600';
      a.addEventListener('click', function (ev) { ev.preventDefault(); location.reload(); });
      e.appendChild(a);
      e.hidden = false;
      fixHeaderOffset();
    }
  }
  function load() {
    var url = MOCK ? 'dev/mock_board.json' : '/api/board';
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (text) {
      lastOk = new Date();
      if (!uiStale) setErr(null);
      var changed = text !== lastText;
      lastText = text;
      if (changed || !data) {
        data = JSON.parse(text);
        checkUiVersion(data.ui_version);
        if (selected && !find(selected)) selected = null;
        renderAll();
        allSessions().forEach(function (x) {
          if (x.s.check_pending && !chkPollers[x.s.session_id]) startCheckPolling(x.s.session_id);
          if (x.s.recap_pending && !recapPollers[x.s.session_id]) startRecapPolling(x.s.session_id);
        });
      } else renderRefreshed();
    }).catch(function (e) {
      setErr('读取看板失败：' + e.message + '（显示的是上次数据）');
      renderRefreshed();
    });
  }

  /* ---------- init ---------- */
  try { collapsed = JSON.parse(lsGet('tracker.collapsed') || '{}') || {}; } catch (e) { collapsed = {}; }
  onlyMe = lsGet('tracker.onlyMe') === '1';
  var cbx = document.getElementById('onlyMe');
  cbx.checked = onlyMe;
  cbx.addEventListener('change', function () { onlyMe = cbx.checked; lsSet('tracker.onlyMe', onlyMe ? '1' : '0'); renderTree(); });
  document.getElementById('refreshBtn').addEventListener('click', load);
  document.getElementById('navtoggle').addEventListener('click', function () {
    var a = document.getElementById('aside'); a.classList.toggle('open');
    document.getElementById('navcar').textContent = a.classList.contains('open') ? '▴' : '▾';
  });
  window.addEventListener('hashchange', function () { var s = hashSid(); if (s !== selected) select(s, true); });
  window.addEventListener('resize', fixHeaderOffset);
  selected = hashSid() || lsGet('tracker.selected') || null;
  if (selected === '') selected = null;
  load().then(function () {
    if (selected && !find(selected)) selected = null;
    renderAll();
    if (window.matchMedia('(max-width:700px)').matches && !selected) document.getElementById('aside').classList.add('open');
    var f = selected && find(selected);
    if (f && f.s.check_pending && !chkPollers[selected]) startCheckPolling(selected);
    if (f && f.s.recap_pending && !recapPollers[selected]) startRecapPolling(selected);
  });
  setInterval(load, 30000);
  // keep the "refreshed" label honest even if the tab sleeps
  document.addEventListener('visibilitychange', function () { if (!document.hidden && lastOk && Date.now() - lastOk > 30000) load(); });
})();
</script>
</body>
